  <g>
    <text class="lb" x="24" y="224">Flow 1</text><text class="sm" x="24" y="241">"from the click to the end"</text>
    <path class="a" d="M190 214h342.2a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4h-342.2z"/><text class="v" x="542" y="225">500K</text>
    <path class="b" d="M190 230h144.2a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4h-144.2z"/><text class="v" x="344" y="241">214K</text>
    <text class="pc" x="736" y="235" text-anchor="end">−57%</text>
  </g>
  <g>
    <text class="lb" x="24" y="279">Flow 2</text><text class="sm" x="24" y="296">"show the call chain"</text>
